<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Florentin Simulator</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #000;
        overflow: hidden;
        /* Prevent iOS bounce scroll and pull-to-refresh */
        overscroll-behavior: none;
        touch-action: none;
        font-family: 'Segoe UI', system-ui, sans-serif;
        /* Fill the entire viewport including notch areas */
        height: 100%;
        width: 100%;
      }
      #root {
        width: 100vw;
        height: 100vh;
        height: 100svh; /* dynamic viewport height on mobile */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
